<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр ЕГЭ по информатике · задания 1–10</title>
<style>
:root{
  --bg:#f3f5fb; --card:#ffffff; --ink:#12141c; --muted:#6b7280; --line:#e6e9f2;
  --acc:#4f46e5; --acc-soft:#eef0ff; --sky:#0ea5e9; --ok:#15a34a; --ok-soft:#e9f9ef;
  --bad:#e11d48; --bad-soft:#fff0f3; --warn:#f59e0b; --warn-soft:#fff8e8;
  --r:18px; --shadow:0 2px 12px rgba(18,20,28,.05), 0 1px 3px rgba(18,20,28,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 10% -10%, #e8ecff 0%, transparent 60%), var(--bg);
  color:var(--ink); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 64px}
/* topbar */
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:rgba(243,245,251,.82);border-bottom:1px solid var(--line)}
.topbar .wrap{padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--sky));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto}
.topttl{font-weight:700;font-size:15px;letter-spacing:.2px}
.topttl span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pbar{flex:1;height:8px;border-radius:99px;background:#e2e6f3;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--sky));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
/* typography */
h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.4px}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:15px;margin:18px 0 6px}
p{margin:0 0 10px}
ul,ol{margin:0;padding-left:22px}
li{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
b,strong{font-weight:650}
code{background:#f1f3fa;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.92em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card.idea{border-color:#dfe3ff;background:linear-gradient(180deg,#fbfbff,#fff)}
.card.warn{background:var(--warn-soft);border-color:#f8e3b0}
.card.ok{background:var(--ok-soft);border-color:#c9ecd6}
/* home */
.hero{margin:22px 0 8px}
.hero h1{font-size:30px}
.hero p{color:var(--muted);max-width:620px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr 1fr}}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mcard:hover{transform:translateY(-2px);border-color:#cfd6f5;box-shadow:0 8px 22px rgba(79,70,229,.12)}
.mcard .n{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.8px}
.mcard .t{font-weight:650;font-size:15px;margin:4px 0 8px;line-height:1.3}
.mcard .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mini{flex:1;height:5px;border-radius:99px;background:#e9ecf6;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc);width:0}
.done{position:absolute;top:10px;right:12px;font-size:16px}
.linkcards{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lcard{flex:1 1 200px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.lcard:hover{border-color:#cfd6f5;transform:translateY(-1px)}
.lcard b{display:block;margin-bottom:2px}
/* module page */
.mhead{display:flex;gap:14px;align-items:flex-start;margin:18px 0 4px}
.mhead .num{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--sky));color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;flex:0 0 auto}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);margin-bottom:10px}
.back:hover{color:var(--ink);border-color:#cfd6f5}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding-left:38px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px}
/* demo */
.demo{background:#fbfcff;border:1px dashed #d5dbf2;border-radius:14px;padding:14px;overflow:hidden}
.cap{font-size:13px;color:var(--muted);margin:10px 0 0}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.pill:hover{border-color:#cfd6f5;background:#fafbff}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:.15s}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=range]{accent-color:var(--acc);width:100%}
.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.btn{border:none;border-radius:11px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#cfd6f5}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:9px}
table{border-collapse:collapse;font-size:14px;background:#fff}
th,td{border:1px solid #dfe3f0;padding:6px 10px;text-align:center}
th{background:#f5f7fd;font-weight:600;font-size:13px}
tr.hot td{background:#eef0ff;font-weight:600}
td.hit{background:#e9f9ef}
/* tasks */
.task{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}
.task .q{font-size:15px;margin-bottom:10px}
.task .q .tn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:700;margin-right:8px;vertical-align:2px}
.task .ans{width:120px}
.fb{font-size:14px;margin-top:8px;display:none}
.fb.show{display:block}
.fb.good{color:var(--ok);font-weight:600}
.fb.bad{color:var(--bad);font-weight:600}
.solbox{display:none;margin-top:10px;padding:10px 12px;background:#f7f8fd;border:1px solid var(--line);border-radius:10px;font-size:14px}
.solbox.show{display:block}
.tools{display:flex;gap:8px;margin-top:8px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
/* plan table */
.ptable td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.ptable td{text-align:left;font-size:13.5px;vertical-align:top}
.chk{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc)}
/* misc */
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.badge.g{background:var(--ok-soft);color:var(--ok)}
.badge.w{background:var(--warn-soft);color:#b45309}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv b{white-space:nowrap}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:560px){
  .topbar .wrap{gap:8px;padding:8px 12px}
  .topttl span{display:none}
  .logo{width:30px;height:30px;font-size:13px}
  .hero h1{font-size:24px}
  .mhead .num{width:46px;height:46px;font-size:17px;border-radius:14px}
  h1{font-size:22px}
  .card{padding:15px}
  .task .ans{width:100px}
}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <div class="logo">И</div>
    <div class="topttl">Тренажёр ЕГЭ<span id="tsub">задания 1–10 · тренажёр</span></div>
    <div class="pbar" data-nav="progress" title="Прогресс" style="cursor:pointer"><i id="pbar"></i></div>
    <div class="pnum" id="pnum" data-nav="progress" style="cursor:pointer">0/33</div>
  </div>
</div>
<div class="wrap" id="view"></div>
<script>

/* ================= ДАННЫЕ КУРСА ================= */
let MODULES = [
{
  n:1, title:'Графы и таблицы', tag:'Задание 1 · 1 балл · решают 90%',
  why:'Самое лёгкое задание экзамена. Здесь проверяют одно умение: увидеть в таблице ту же картину, что нарисована на схеме.',
  idea:'На рисунке — схема дорог: кружки это города, линии это дороги. Рядом таблица, где 1 значит «между этими двумя городами есть дорога». Нужно понять, какой кружок назван П1, какой П2 и так далее. Ключ — число дорог: посчитай линии у кружка и единицы в строке таблицы.',
  steps:[
    'Посчитай у каждого кружка, сколько линий из него выходит. Это его «степень».',
    'Найди строку таблицы с таким же количеством единиц — это тот же город.',
    'Если количество уникальное, город определён. Вычеркни его из списка.',
    'Если у двух городов число дорог одинаковое — различай их по соседям (с какими городами они соединены).'
  ],
  traps:[
    'Таблица симметрична: дорога из А в Б записана дважды — в строке А и в строке Б.',
    'Считай именно единицы. Нули — это отсутствие дороги, их не считаем.',
    'Диагональ таблицы (город сам с собой) всегда пустая или нули — её не считаем.',
    'Одинаковые степени — самая частая причина ошибки. Тогда смотри не на число, а на «с кем дружит».'
  ],
  tasks:[
    {q:'В таблице 5×5 число единиц по строкам: П1 — 2, П2 — 1, П3 — 3, П4 — 2, П5 — 2. На схеме у города К выходит ровно три дороги. Какой это город?', ans:'п3', kind:'text',
     hint:'Число дорог у города равно числу единиц в его строке.', sol:'У К три дороги, значит ищем строку с тремя единицами — это П3.'},
    {q:'В таблице вне диагонали ровно 10 единиц. Сколько всего дорог на схеме?', ans:'5', kind:'num',
     hint:'Каждая дорога записана дважды: «из А в Б» и «из Б в А».', sol:'10 : 2 = 5 дорог.'},
    {q:'На схеме 6 городов, из каждого выходит ровно 3 дороги. Сколько всего дорог на схеме?', ans:'9', kind:'num',
     hint:'Посчитай все «концы» дорог, а потом вспомни, что у дороги два конца.', sol:'6 × 3 = 18 концов. 18 : 2 = 9 дорог.'}
  ]
},
{
  n:2, title:'Логика и таблицы истинности', tag:'Задание 2 · 1 балл · решают 79%',
  why:'Истина или ложь — основа всех алгоритмов и условий в программах. На экзамене дают логическое выражение, надо найти строку таблицы, где оно истинно.',
  idea:'Есть всего три операции. «И» (∧) — верно только если верно и то, и другое. «ИЛИ» (∨) — верно, если верно хотя бы одно. «НЕ» (¬) — переворачивает значение. Стрелка «→» (импликация) ложна в одном единственном случае: из истины следует ложь.',
  steps:[
    'Выпиши все наборы переменных: для 2 переменных — 4 строки, для 3 — 8 строк.',
    'Считай значение выражения слева направо по приоритету: сначала НЕ, потом И, потом ИЛИ, стрелка — последней.',
    'Сравни полученный столбец значений с вариантами ответа. Совпал полностью — это ответ.',
    'Проверяй себя: подставь один набор руками и сверь.'
  ],
  traps:[
    'Приоритет: ¬ выше ∧, ∧ выше ∨. Скобки важнее всего.',
    'A → B читается «если A, то B» и равно ¬A ∨ B. Ложно только при A=1, B=0.',
    '1 ∧ 1 = 1, но 1 ∧ 0 = 0. Не путай «И» с обычным сложением.',
    'В ответе обычно просят номер строки — считай строки таблицы сверху вниз, как в задании.'
  ],
  tasks:[
    {q:'Чему равно (1 ∧ 0) ∨ ¬1 ?', ans:'0', kind:'num',
     hint:'Сначала посчитай скобку, потом отрицание.', sol:'1 ∧ 0 = 0. ¬1 = 0. 0 ∨ 0 = 0.'},
    {q:'Сколько единиц в столбце значений выражения A → B (переменные A и B, все 4 набора)?', ans:'3', kind:'num',
     hint:'Импликация ложна только при A=1, B=0.', sol:'Наборы: 00→1, 01→1, 10→0, 11→1. Единиц — 3.'},
    {q:'Сколько единиц в столбце значений выражения A ∨ (¬B ∧ C)?', ans:'5', kind:'num',
     hint:'Если A=1, выражение уже истинно — это сразу 4 строки из 8.', sol:'A=1 даёт 1 в четырёх строках. Среди A=0 истинно только B=0, C=1 — ещё одна строка. Итого 5.'},
    {q:'Верно ли выражение (A ∧ B) ∨ ¬C при A=1, B=0, C=1? Ответ: да или нет.', ans:'нет', kind:'text',
     hint:'Посчитай скобку: 1 ∧ 0.', sol:'A ∧ B = 0, ¬C = 0, значит 0 ∨ 0 = 0. Ответ: нет.'}
  ]
},
{
  n:3, title:'Поиск в базе данных', tag:'Задание 3 · 1 балл · решают 76%',
  why:'Это работа с таблицей как в Excel: отфильтровать записи по условию и посчитать. Один из самых быстрых баллов, если уметь фильтр.',
  idea:'Дана таблица (файл .ods) и вопрос вроде «Сколько товаров категории Техника из СПб дороже 20 000?». Это три условия сразу, между ними «И». Нужно оставить только строки, где выполнены все условия, и посчитать их.',
  steps:[
    'Прочитай вопрос и выпиши все условия отдельно, каждое на своей строке.',
    'Определи, что между ними: «И» (все сразу) или «ИЛИ» (хотя бы одно).',
    'В LibreOffice: выдели таблицу → Данные → Автофильтр, поставь условия в стрелках заголовков.',
    'Посчитай оставшиеся строки. Если нужна сумма — СУММЕСЛИ или СЧЁТЕСЛИ по диапазону.'
  ],
  traps:[
    '«И» строже, чем кажется: строка должна подойти по всем условиям одновременно.',
    'Следи за единицами измерения: «дороже 20 тысяч» — это 20000, а не 20.',
    'Похожие названия («Монитор» и «Монитор игровой») — фильтр по тексту может захватить лишнее.',
    'Всегда пересчитывай глазами хотя бы 2–3 строки: фильтр мог скрыть нужное.'
  ],
  tasks:[
    {q:'В таблице: Ноутбук/Техника/52000/СПб, Принтер/Техника/18000/Москва, Стол/Мебель/9000/СПб, Кресло/Мебель/14000/Казань, Монитор/Техника/24000/СПб, Шкаф/Мебель/21000/Москва, Клавиатура/Техника/3500/СПб, Лампа/Мебель/2500/Казань. Сколько техники из СПб дороже 20 000?', ans:'2', kind:'num',
     hint:'Три условия через «И»: Техника, СПб, цена > 20000.', sol:'Подходят Ноутбук (52000) и Монитор (24000). Клавиатура дешевле. Ответ: 2.'},
    {q:'По той же таблице: сколько всего записей по мебели из Казани?', ans:'2', kind:'num',
     hint:'Мебель + Казань.', sol:'Кресло и Лампа. Принтер и Шкаф — из Москвы. Ответ: 2.'},
    {q:'По той же таблице: суммарная стоимость всех принтеров и мониторов вместе?', ans:'42000', kind:'num',
     hint:'Это условие «ИЛИ» по названию, но обе строки просто складываем.', sol:'18000 + 24000 = 42000.'}
  ]
},
{
  n:4, title:'Кодирование и условие Фано', tag:'Задание 4 · 1 балл · решают 83%',
  why:'Так работают все архивы, Wi-Fi и сообщения: короткие коды частым символам, и при этом сообщение должно однозначно расшифровываться.',
  idea:'Условие Фано: ни один код не должен быть началом другого кода. Тогда при чтении слева направо всегда понятно, где кончается буква. Если код 0 и код 01 — непонятно: прочитали 01, это «А потом что-то» или «Б»? Расшифровка ломается.',
  steps:[
    'Выпиши все коды и сравни их попарно: не является ли один началом другого.',
    'Если нашёл такую пару — такой набор кодов использовать нельзя.',
    'Для расшифровки читай биты слева направо и набирай, пока не совпадёт с каким-нибудь кодом.',
    'Нашёл код — записал букву, начинай набор заново со следующего бита.'
  ],
  traps:[
    'Проверять нужно все пары, а не только соседние.',
    'Условие Фано бывает прямое и обратное — читай формулировку в задании.',
    'Короткий код «съедает» длинные: если есть 0, то 01, 001 и 0001 уже нельзя.',
    'Равномерный код: на N символов нужно i бит, где 2^i ≥ N.'
  ],
  tasks:[
    {q:'Сколько бит нужно для равномерного кода на 6 букв?', ans:'3', kind:'num',
     hint:'2 бита дают 4 кода, 3 бита — 8.', sol:'2^3 = 8 ≥ 6, а 2^2 = 4 < 6. Ответ: 3 бита.'},
    {q:'Кодом длиной 5 бит можно закодировать сколько разных символов?', ans:'32', kind:'num',
     hint:'2 в степени длины кода.', sol:'2^5 = 32 символа.'},
    {q:'Коды: А = 0, Б = 10, В = 11. Расшифруй сообщение 0101110 (запиши буквами).', ans:'абвба', kind:'text',
     hint:'Читай слева направо: 0 — это А, дальше 10 — это Б.', sol:'0→А, 10→Б, 11→В, 10→Б, 0→А. Получается АБВБА.'},
    {q:'Можно ли использовать коды А = 0, Б = 01, В = 11? Ответ: да или нет.', ans:'нет', kind:'text',
     hint:'Сравни А и Б.', sol:'Код 0 — начало кода 01, расшифровка неоднозначна. Ответ: нет.'}
  ]
},

     (n<MODULES.length?'<button class="btn primary" data-nav="m'+(n+1)+'">Тип '+(n+1)+' →</button>':'<button class="btn primary" data-nav="exam">Мини-зачёт →</button>')+'</div>';
  const box=$('#demobox');
  try{DEMOS[n](box,$('#democap'));}catch(e){box.textContent='Демо не загрузилось';console.error(e);}
  renderTasks($('#tasks'),m);
}

function renderTasks(root,m){
  m.tasks.forEach((t,i)=>{
    const id='m'+m.n+'t'+(i+1);
    const solved=!!S.solved[id];
    const card=document.createElement('div');
    card.className='task';
    card.innerHTML='<div class="q"><span class="tn">'+(i+1)+'</span>'+t.q+'</div>'+
      '<div class="row"><input class="ans" type="text" inputmode="'+(t.kind==='num'?'decimal':'text')+'" placeholder="ответ" autocomplete="off">'+
      '<button class="btn primary sm chk">Проверить</button>'+
      '<button class="btn ghost sm hintb">Подсказка</button>'+
      '<button class="btn ghost sm solb">Решение</button></div>'+
      '<div class="fb"></div><div class="solbox">'+t.sol+'</div>';
    root.appendChild(card);
    const inp=$('.ans',card), fb=$('.fb',card);
    const check=()=>{
      const good=t.kind==='num'
        ? Math.abs(parseFloat(norm(inp.value))-parseFloat(t.ans))<1e-6
        : norm(inp.value)===norm(t.ans);
      fb.className='fb show '+(good?'good':'bad');
      if(good){
        fb.textContent='✅ Верно!';
        S.solved[id]=true;save();updateBar();
        card.style.borderColor='#b9e6c9';card.style.background='#fbfefc';
      }else{
        fb.textContent='❌ Пока нет. Попробуй ещё раз или посмотри подсказку.';
        card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),320);
      }
    };
    $('.chk',card).onclick=check;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    $('.hintb',card).onclick=()=>{fb.className='fb show';fb.style.color='var(--warn)';fb.innerHTML='💡 '+t.hint;};
    $('.solb',card).onclick=()=>{$('.solbox',card).classList.add('show');};
    if(solved){card.style.borderColor='#b9e6c9';card.style.background='#fbfefc';fb.className='fb show good';fb.textContent='✅ Уже решено';}
  });
}

/* ================= МИНИ-ЗАЧЁТ ================= */
function viewExam(v){
  const picks=[];
  const pool=MODULES.map(m=>m).sort(()=>Math.random()-0.5).slice(0,Math.min(10,MODULES.length));
  pool.forEach(m=>{
    const i=Math.floor(Math.random()*m.tasks.length);
    picks.push({m,t:m.tasks[i],i});
  });
  let html='<button class="back" data-nav="home">← На главную</button>'+
   '<div class="mhead"><div class="num">З</div><div><h1>Мини-зачёт</h1><div class="small muted">'+picks.length+' задач · по одной от разных типов · без подсказок</div></div></div>'+
   '<div class="card warn"><p style="margin:0"><b>Правила:</b> 40 минут, калькулятором можно, подсказки нельзя. Считай не балл, а список типов, которые просели.</p></div>';
  picks.forEach((p,k)=>{
    html+='<div class="task" data-k="'+k+'"><div class="q"><span class="tn">'+(k+1)+'</span><span class="badge">тип '+p.m.n+'</span> '+p.t.q+'</div>'+
      '<div class="row"><input class="ans" type="text" placeholder="ответ" autocomplete="off"></div><div class="fb"></div></div>';
  });
  html+='<div class="row" style="margin-top:14px"><button class="btn primary" id="exchk">Проверить всё</button><button class="btn ghost" id="exnew">Ещё раз</button></div><div id="exres"></div>';
  v.innerHTML=html;
  $('#exchk').onclick=()=>{
    let ok=0,wrong=[];
    picks.forEach((p,k)=>{
      const card=v.querySelector('[data-k="'+k+'"]');
      const val=$('.ans',card).value;
      const good=p.t.kind==='num'?Math.abs(parseFloat(norm(val))-parseFloat(p.t.ans))<1e-6:norm(val)===norm(p.t.ans);
      const fb=$('.fb',card);fb.className='fb show '+(good?'good':'bad');
      if(good){ok++;fb.textContent='✅ верно';}
      else{wrong.push('тип '+p.m.n+' — '+disp(p.t));fb.innerHTML='❌ неверно. Правильный ответ: <b>'+disp(p.t)+'</b><br><span class="muted">'+p.t.sol+'</span>';}
    });
    const pct=Math.round(ok/picks.length*100);
    let verdict=pct>=80?'Отличный уровень: эти 10 баллов почти твои. Идём дальше по остальным типам.':
      pct>=50?'Хорошая база. Разбери типы, где ошиблась, и повтори зачёт через 3 дня.':
      'Пока рано проходить зачёт. Вернись к демо и трём задачам каждого типа — по 15 минут в день.';
    S.exams=(S.exams||[]).concat([{ts:Date.now(),score:ok,total:picks.length,failed:picks.filter((p,k)=>!v.querySelector('[data-k="'+k+'"] .fb.good')).map(p=>p.m.n)}]).slice(-10);
    save();
    $('#exres').innerHTML='<div class="card '+(pct>=50?'ok':'warn')+'"><h2>Результат: '+ok+' из '+picks.length+'</h2><p>'+verdict+'</p>'+
      (wrong.length?'<div class="small muted">Разобрать: '+wrong.join(' · ')+'</div>':'')+'</div>';
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  };
  $('#exnew').onclick=()=>viewExam(v);
}

function progData(){
  const per=MODULES.map(m=>({n:m.n,t:m.title,done:m.tasks.filter((t,i)=>S.solved['m'+m.n+'t'+(i+1)]).length,all:m.tasks.length}));
  return {per, total:per.reduce((a,x)=>a+x.done,0)};
}
function progText(){
  const {per,total}=progData();
  const dt=new Date(S.ts||Date.now());
  const pad=x=>String(x).padStart(2,'0');
  return 'ЕГЭ информатика 1–10: '+total+'/'+TOTAL+' | '+per.map(x=>x.n+':'+x.done+'/'+x.all).join(' ')+
    ' | '+pad(dt.getDate())+'.'+pad(dt.getMonth()+1)+'.'+dt.getFullYear()+' '+pad(dt.getHours())+':'+pad(dt.getMinutes());
}
function progCode(){
  const payload={v:1,s:Object.keys(S.solved).filter(k=>S.solved[k]),p:Object.keys(S.plan||{}).filter(k=>S.plan[k]),
    e:(S.exams||[]).slice(-3).map(x=>[x.ts,x.score,x.total,x.failed||[]])};
  try{return 'EGE10-'+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));}catch(e){return '';}
}
function applyCode(code){
  try{
    const raw=String(code).trim().replace(/^EGE10-/,'');
    const data=JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(!data||!Array.isArray(data.s))throw new Error('нет данных');
    S.solved={};data.s.forEach(k=>{if(/^m\d+t\d+$/.test(k))S.solved[k]=true;});
    S.plan={};(data.p||[]).forEach(k=>{S.plan[k]=true;});
    S.exams=Array.isArray(data.e)?data.e.map(e=>({ts:e[0],score:e[1],total:e[2],failed:e[3]||[]})):[];
    save();return true;
  }catch(e){return false;}
}

    try{await navigator.clipboard.writeText(txt);}
    catch(e){codeBox.select();document.execCommand('copy');}
    $('#pcopied',v).textContent='скопировано';

  };
  $('#pload',v).onclick=()=>{
    const raw=$('#pin',v).value;
    if(!raw.trim())return;
    if(!applyCode(raw)){$('#pmsg',v).style.color='#e11d48';$('#pmsg',v).textContent='Код не распознан. Нужна строка, начинающаяся с EGE10-';return;}
    updateBar();viewProgress(v);

function render(){
  const h=location.hash.replace('#','')||'home';
  const v=$('#view');
  v.innerHTML='';updateBar();
  if(h==='home')viewHome(v);
  else if(h==='plan')viewPlan(v);

  else if(h==='exam')viewExam(v);
  else if(h==='progress')viewProgress(v);
  else if(/^m\d+$/.test(h))viewModule(v,+h.slice(1));
  else viewHome(v);
  window.scrollTo(0,0);
}

/* --- 4. Фано --- */
DEMOS[4]=function(root,cap){
  const sets={
    good:[['А','0'],['Б','10'],['В','110'],['Г','111']],
    bad:[['А','0'],['Б','01'],['В','110'],['Г','111']]
  };
  let cur='good',bits='0101110';
  root.innerHTML='<div class="row" style="margin-bottom:10px"><button class="pill on" data-s="good">Правильные коды</button><button class="pill" data-s="bad">Сломанные коды</button></div>'+
   '<div id="fcode" class="row" style="margin-bottom:10px"></div>'+
   '<div class="row"><input id="fbits" type="text" value="'+bits+'" style="width:180px"><button class="btn primary sm" id="fgo">Расшифровать</button></div>'+
   '<div id="fout" style="margin-top:12px"></div>';
  const drawCodes=()=>{
    $('#fcode',root).innerHTML=sets[cur].map(([l,c])=>'<span class="badge" style="font-size:13px;padding:5px 10px">'+l+' = '+c+'</span>').join('');
  };
  const parse=(s,codes,memo={})=>{
    if(s==='')return 1;
    if(memo[s]!==undefined)return memo[s];
    let n=0;
    for(const [l,c] of codes){if(s.startsWith(c)){n+=parse(s.slice(c.length),codes,memo);if(n>3)break;}}
    return memo[s]=n;
  };
  const decode=(s,codes)=>{
    const out=[];let i=0;
    while(i<s.length){
      let hit=null;
      for(const [l,c] of codes){if(s.startsWith(c,i)&&(!hit||c.length<hit[1].length))hit=[l,c];}
      if(!hit)return null;
      out.push(hit);i+=hit[1].length;
    }
    return out;
  };
  const run=()=>{
    const codes=sets[cur],s=$('#fbits',root).value.replace(/[^01]/g,'');
    const conflict=(()=>{for(const [la,a] of codes)for(const [lb,b] of codes)if(a!==b&&b.startsWith(a))return [la,a,lb,b];return null;})();
    let html='';
    if(conflict)html+='<div class="card warn" style="margin:0 0 10px"><b>Ловушка:</b> код '+conflict[0]+' = '+conflict[1]+' — начало кода '+conflict[2]+' = '+conflict[3]+'. Набор кодов использовать нельзя.</div>';
    const variants=parse(s,codes);
    const res=decode(s,codes);
    if(!res){html+='<div style="color:#e11d48;font-weight:600">Так расшифровать нельзя: в конце остались биты без кода.</div>';}
    else{
      html+='<div class="row" style="gap:6px;margin-bottom:8px">';
      res.forEach(([l,c])=>{html+='<span class="badge" style="background:#eef0ff;color:#4f46e5">'+c+' → '+l+'</span>';});
      html+='</div><div style="font-size:20px;font-weight:700;letter-spacing:2px">'+res.map(r=>r[0]).join('')+'</div>';
      html+='<div class="small muted" style="margin-top:6px">Способов прочитать это сообщение: '+variants+(variants>1?' — значит, код неоднозначный!':' — единственный, всё хорошо.')+'</div>';
    }
    $('#fout',root).innerHTML=html;
  };
  $$('[data-s]',root).forEach(b=>b.onclick=()=>{
    cur=b.getAttribute('data-s');
    $$('[data-s]',root).forEach(x=>x.classList.toggle('on',x===b));
    drawCodes();run();
  });
  $('#fgo',root).onclick=run;
  $('#fbits',root).addEventListener('keydown',e=>{if(e.key==='Enter')run();});
  drawCodes();run();
  cap.textContent='Читаем слева направо и набираем биты, пока не совпадёт с кодом буквы. Если один код — начало другого, появляется второй способ прочтения.';
};

DEMOS[6]=function(root,cap){
  const progs=[
    {name:'4 × [вперёд 3 вправо 90]',cmds:[['F',3],['R',90]],reps:4},
    {name:'2 × [вперёд 5 вправо 90 вперёд 3 вправо 90]',cmds:[['F',5],['R',90],['F',3],['R',90]],reps:2},
    {name:'2 × [вперёд 4 вправо 90 вперёд 2 вправо 90]',cmds:[['F',4],['R',90],['F',2],['R',90]],reps:2}
  ];
  let pi=0,timer=null;
  root.innerHTML='<div id="tprog" class="row" style="margin-bottom:10px"></div><div style="display:flex;justify-content:center"><div id="tsvg"></div></div><div id="tcnt" style="text-align:center;margin-top:8px;font-weight:650"></div>';
  const grid=6,cell=40,pad=6;
  const draw=()=>{
    if(timer){clearInterval(timer);timer=null;}
    const p=progs[pi];
    const dirs=[[1,0],[0,1],[-1,0],[0,-1]];let x=0,y=0,dir=0;
    const seq=[];
    for(let r=0;r<p.reps;r++)for(const [c,v] of p.cmds){
      if(c==='F'){for(let k=0;k<v;k++){x+=dirs[dir][0];y+=dirs[dir][1];seq.push([x,y]);}}
      else if(c==='R'){dir=(dir+Math.round(v/90))%4;}
    }
    let svg='<svg width="'+(grid*cell+pad*2)+'" height="'+(grid*cell+pad*2)+'" style="max-width:100%">';
    for(let i=0;i<=grid;i++){
      svg+='<line x1="'+pad+'" y1="'+(pad+i*cell)+'" x2="'+(pad+grid*cell)+'" y2="'+(pad+i*cell)+'" stroke="#e2e6f3"/>';
      svg+='<line x1="'+(pad+i*cell)+'" y1="'+pad+'" x2="'+(pad+i*cell)+'" y2="'+(pad+grid*cell)+'" stroke="#e2e6f3"/>';
    }
    svg+='<g id="tpaint"></g><circle cx="'+(pad+cell/2)+'" cy="'+(pad+(grid-0.5)*cell)+'" r="7" fill="#4f46e5"/>'+
      '<text x="'+(pad+cell/2)+'" y="'+(pad+(grid-0.5)*cell+3.5)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">S</text>'+
      '<text x="'+(pad+cell/2)+'" y="'+(pad+grid*cell+14)+'" text-anchor="middle" font-size="10" fill="#8b93b8">старт</text></svg>';
    $('#tsvg',root).innerHTML=svg;
    const g=$('#tpaint',root);const seen=new Set();
    let i=0;
    const step=()=>{
      if(!document.body.contains(g)){clearInterval(timer);return;}
      if(i>=seq.length){clearInterval(timer);return;}
      const [cx,cy]=seq[i++];
      const key=cx+','+cy;
      const px=pad+cx*cell, py=pad+(grid-1-cy)*cell;
      if(!seen.has(key)){
        seen.add(key);
        const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
        r.setAttribute('x',px+1);r.setAttribute('y',py+1);r.setAttribute('width',cell-2);r.setAttribute('height',cell-2);
        r.setAttribute('rx','5');r.setAttribute('fill','#c7cdf7');
        g.appendChild(r);
      }
      $('#tcnt',root).innerHTML='Закрашено клеток: <span style="color:#4f46e5">'+seen.size+'</span> из '+(grid*grid);
    };
    $('#tcnt',root).innerHTML='Закрашено клеток: 0';
    timer=setInterval(step,90);
  };
  $('#tprog',root).innerHTML=progs.map((p,i)=>'<button class="pill '+(i===pi?'on':'')+'" data-p="'+i+'" style="font-size:12px">'+p.name+'</button>').join('');
  $$('[data-p]',root).forEach(b=>b.onclick=()=>{pi=+b.getAttribute('data-p');$$('[data-p]',root).forEach(x=>x.classList.toggle('on',x===b));draw();});
  draw();
  cap.textContent='Черепаха красит клетку, в которую пришла. Поворот на 90 — четверть оборота. Понажимай программы и посчитай клетки сам, прежде чем смотреть счётчик.';
};

      '<div class="small muted" style="text-align:center;margin-top:4px">Длина A = '+Math.max(0,e-s)+' · минимально возможная = 20 (это сам P)</div>';
  };
  $$('input',root).forEach(e=>{e.oninput=upd;});
  upd();
  cap.textContent='Двигай границы A: пока A не накроет P целиком, появляются красные точки — это и есть нарушение (x∈P)→(x∈A).';
};

/* --- 16. Рекурсия --- */
DEMOS[16]=function(root,cap){
  root.innerHTML='<div style="margin-bottom:10px"><span class="lbl">Вычисляем F(<b id="n16v">4</b>)</span><input type="range" id="n16" min="1" max="6" value="4"></div><div id="o16"></div>';
  const upd=()=>{
    const n=+$('#n16',root).value;
    $('#n16v',root).textContent=n;
    let callsN=0;
    const val=memo=>memo;
    const tree=[];let total=0;
    const F=(k,depth)=>{
      total++;
      if(!tree[depth])tree[depth]=[];
      tree[depth].push(k);
      if(k<=1)return 1;
      return F(k-1,depth+1)+F(k-2,depth+1);
    };
    const v=F(n,0);
    let h='<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px">';
    tree.forEach((arr,d)=>{
      h+='<div style="display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 4px '+(d*10)+'px">';
      arr.forEach(k=>{h+='<span style="font:12px ui-monospace,monospace;padding:3px 7px;border-radius:7px;background:'+(k<=1?'#e9f9ef':'#eef0ff')+';color:'+(k<=1?'#15a34a':'#4f46e5')+'">F('+k+')</span>';});
      h+='</div>';
    });
    h+='</div>';
    $('#o16',root).innerHTML=h+
      '<div class="kv" style="margin-top:10px"><b>Значение</b><span style="font-size:18px;font-weight:700;color:#4f46e5">F('+n+') = '+v+'</span>'+
      '<b>Всего вызовов</b><span>'+total+' (база тоже считается вызовом)</span></div>';
  };
  $('#n16',root).oninput=upd;
  upd();
  cap.textContent='Каждая строка — следующий уровень вызовов. Зелёные — база, дальше она не раскрывается. Считай кружки — это и есть ответ на «сколько вызовов».';
};

render();
